<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">知天下与 Provider A：两个仓库，一条闭环</title>
  <desc id="desc">浏览器经网站入口与知天下 BFF 请求独立 Provider A，由 Provider 调用 IMA。网站数据和账号数据分别持久化。</desc>
  <rect width="1200" height="420" fill="#f7f9fb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="40" y="58" font-size="29" font-weight="700" fill="#121d30">从这个仓库开始，部署整条问答链路。</text>
    <rect x="40" y="105" width="195" height="130" rx="8" fill="#fff" stroke="#d5dce7"/>
    <text x="65" y="157" font-size="27" font-weight="700" fill="#121d30">浏览器</text>
    <text x="65" y="203" font-size="22" fill="#536278">只访问同源</text>
    <path d="M245 170H285m-11-8 11 8-11 8" fill="none" stroke="#258196" stroke-width="3"/>
    <rect x="295" y="105" width="280" height="130" rx="8" fill="#e9f4f6" stroke="#258196"/>
    <text x="320" y="157" font-size="27" font-weight="700" fill="#121d30">知天下网站 / BFF</text>
    <text x="320" y="203" font-size="22" fill="#365769">Nginx · 身份 · 待发队列</text>
    <path d="M585 170H625m-11-8 11 8-11 8" fill="none" stroke="#258196" stroke-width="3"/>
    <rect x="635" y="105" width="280" height="130" rx="8" fill="#e9f4ef" stroke="#218066"/>
    <text x="660" y="157" font-size="27" font-weight="700" fill="#121d30">Provider A</text>
    <text x="660" y="203" font-size="22" fill="#365769">账号 · 会话 · 持久任务</text>
    <path d="M925 170H965m-11-8 11 8-11 8" fill="none" stroke="#258196" stroke-width="3"/>
    <rect x="975" y="105" width="185" height="130" rx="8" fill="#fff" stroke="#d5dce7"/>
    <text x="1000" y="157" font-size="27" font-weight="700" fill="#121d30">腾讯 IMA</text>
    <text x="1000" y="203" font-size="22" fill="#536278">检索与生成</text>
    <path d="M435 240V265M775 240V265" stroke="#b1bfce" stroke-width="2"/>
    <text x="345" y="300" font-size="23" fill="#536278">网站独立数据卷</text>
    <text x="685" y="300" font-size="23" fill="#536278">账号独立数据卷</text>
    <path d="M40 328H1160" stroke="#d5dce7"/>
    <text x="40" y="370" font-size="23" fill="#121d30">默认独立安装：自己的服务、账号与数据，不依赖维护者电脑。</text>
    <text x="40" y="404" font-size="20" fill="#536278">人工扫码与知识库授权仍需完成；服务启动不等于真实问答验收。</text>
  </g>
</svg>
