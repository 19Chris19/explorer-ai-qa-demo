services:
  provider-a:
    image: ${PROVIDER_IMAGE:-air-provider-baseline-ima-qa-web:latest}
    restart: unless-stopped
    env_file: .docker-lab/provider.env
    ports:
      - "127.0.0.1:${PROVIDER_HOST_PORT:-3317}:3000"
    volumes:
      - provider-state:/app/runtime
    networks: [backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 15s
      start_period: 120s
      retries: 5
  explorer-qa:
    image: ${EXPLORER_IMAGE:-air-explorer:lab}
    build:
      context: .
      args:
        SOURCE_REVISION: ${EXPLORER_REVISION:-local-dev}
    restart: unless-stopped
    env_file: .docker-lab/explorer.env
    environment:
      PORT: "4317"
      DEMO_LISTEN_HOST: 0.0.0.0
      DEMO_DISABLE_ADMIN: "1"
      DEMO_ASSET_PREFIX: ${DEMO_ASSET_PREFIX:-}
      DEMO_RUNTIME_DIR: /var/lib/explorer-qa
      PROVIDER_A_BASE_URL: http://provider-a:3000
      DEMO_RELEASE_REVISION: ${EXPLORER_REVISION:-docker-lab}
    volumes:
      - explorer-state:/var/lib/explorer-qa
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4317/api/qa/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 15s
      start_period: 120s
      retries: 5
    depends_on:
      provider-a:
        condition: service_healthy
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4417}:8080"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    depends_on:
      explorer-qa:
        condition: service_healthy
networks:
  backend:
volumes:
  provider-state:
  explorer-state:
