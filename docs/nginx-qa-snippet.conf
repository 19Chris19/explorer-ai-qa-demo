# Insert inside the main site's HTTPS server block. Keep its existing header
# and sidebar routes; the Vue adapter renders only the QA content region.
location ^~ /qa-app/internal/ { return 404; }
location ^~ /qa-app/admin { return 404; }
location = /qa-app { return 308 /qa-app/; }
location ^~ /qa-app/ {
    proxy_pass http://127.0.0.1:4317/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 210s;
    add_header Cache-Control "no-store" always;
}
