# Merge with compose.linux.yaml, always under a DIFFERENT project name.
services:
  provider-a:
    image: node:22-bookworm-slim
    command: [node, /fixture/provider.mjs]
    working_dir: /app
    volumes:
      - ./deploy/docker/synthetic-provider.mjs:/fixture/provider.mjs:ro
    ports: !reset []
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
  gateway:
    networks: [backend, browser-access]
    ports: !override
      - "127.0.0.1:4418:8080"
networks:
  browser-access:
  backend:
    internal: true
