# Standalone isolated fixture. Never merge this file with a live Compose project.
services:
  provider-a:
    image: ${PROVIDER_TASK_IMAGE:?Set an isolated reviewed Provider candidate image}
    command: [node, /fixture/durable-provider.cjs]
    volumes:
      - ./durable-provider.cjs:/fixture/durable-provider.cjs:ro
      - provider-test-data:/app/runtime
    networks: [backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  explorer-qa:
    image: ${WEBSITE_TASK_IMAGE:?Set an isolated reviewed website candidate image}
    environment:
      DEMO_LISTEN_HOST: 0.0.0.0
      DEMO_COOKIE_SECRET: synthetic-durable-cookie
      PROVIDER_A_BASE_URL: http://provider-a:3000
      PROVIDER_A_API_TOKEN: synthetic-api
      PROVIDER_A_INTERNAL_SERVICE_TOKEN: synthetic-service
      PROVIDER_A_KNOWLEDGE_SCOPE_REF: ${SYNTHETIC_SCOPE:?Set sha256 of synthetic-kb}
    volumes:
      - website-test-data:/var/lib/explorer-qa
    networks: [backend]
    depends_on:
      provider-a: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4317/api/qa/health').then(r=>r.json()).then(h=>process.exit(h.ready&&h.durableTasksSupported?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1::8080"
    networks: [backend, browser-access]
    depends_on:
      explorer-qa: {condition: service_healthy}
networks:
  backend:
    internal: true
  browser-access:
volumes:
  provider-test-data:
  website-test-data:
