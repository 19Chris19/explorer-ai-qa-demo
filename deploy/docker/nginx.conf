events {}
http {
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Explorer-Preview-Visitor "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 210s;
    add_header Cache-Control "no-store" always;
    location = / { proxy_pass http://explorer-qa:4317; }
    location ^~ /api/qa/ { proxy_pass http://explorer-qa:4317; }
    location ~ ^/(admin|internal)(/|\.|$) { return 404; }
    location ~ ^/(app\.js|styles\.css|chat\.css|icons\.svg|brand-orbit\.png|answer-markdown\.js|source-evidence\.mjs|questions\.json|question-rotation\.mjs|vendor/(marked\.umd\.js|purify\.min\.js))$ {
      proxy_pass http://explorer-qa:4317;
    }
    location / { return 404; }
  }
}
